x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '3000'
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://convo:convo@postgres:5432/convo?schema=public
  DATABASE_CONNECTION_TIMEOUT_MS: '5000'
  ACCESS_TOKEN_SECRET: local-compose-access-token-secret-change-before-deployment
  ACCESS_TOKEN_TTL_SECONDS: '900'
  REFRESH_TOKEN_TTL_DAYS: '30'
  JWT_ISSUER: convo-api
  JWT_AUDIENCE: convo-client
  CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:5173}
  ATTACHMENT_STORAGE_DRIVER: local
  LOCAL_STORAGE_DIRECTORY: /app/storage
  LOCAL_STORAGE_SIGNING_SECRET: local-compose-storage-signing-secret-change-before-deployment
  LOCAL_STORAGE_URL_TTL_SECONDS: '300'
  REDIS_URL: redis://redis:6379
  REDIS_CONNECT_TIMEOUT_MS: '5000'
  REDIS_COMMAND_TIMEOUT_MS: '2000'
  REDIS_RECONNECT_MAX_DELAY_MS: '3000'

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: convo
      POSTGRES_USER: convo
      POSTGRES_PASSWORD: convo
    ports:
      - '127.0.0.1:${CONVO_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:8.2.9-bookworm@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--loglevel', 'warning']
    ports:
      - '127.0.0.1:${CONVO_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: tooling
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build:
      context: .
      target: tooling
    command: ['npm', 'run', 'db:seed']
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ['seed']
    restart: 'no'

  api:
    build:
      context: .
      target: runtime
    image: convo-chat-backend:local
    environment: *api-environment
    ports:
      - '127.0.0.1:${CONVO_API_PORT:-3000}:3000'
    volumes:
      - attachment-data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  attachment-data:
  postgres-data:
